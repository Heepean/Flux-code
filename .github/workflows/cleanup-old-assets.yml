name: Clean up old Flux Hands installers

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove installers from older releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/cleanup-old-release-assets.ps1
