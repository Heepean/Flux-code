name: Clean up old Flux Hands installers

on:
  push:
    branches:
      - main
    tags:
      - 'cleanup-v*'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove installers from older releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseTag = $env:GITHUB_REF_NAME -replace '^cleanup-', ''
          ./scripts/cleanup-old-release-assets.ps1 -CurrentReleaseTag $releaseTag
