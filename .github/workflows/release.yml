name: Release Windows app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Check signing secrets
        shell: pwsh
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Configure UPDATER_PUBLIC_KEY, TAURI_SIGNING_PRIVATE_KEY, and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets first.'
          }
      - name: Build signed updater bundle
        run: npm run tauri build
        env:
          UPDATER_PUBLIC_KEY: ${{ secrets.UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Validate release version and prepare assets
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag $($env:RELEASE_TAG) does not match app version $($config.version) (expected $expectedTag)."
          }
          $sourceInstaller = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $sourceInstaller) { throw 'NSIS installer was not generated.' }
          $sourceSignature = "$($sourceInstaller.FullName).sig"
          if (-not (Test-Path $sourceSignature)) { throw 'Updater signature was not generated. Check signing secrets.' }
          $assetName = "Flux.Code_$($config.version)_x64-setup.exe"
          $installer = Join-Path $env:RUNNER_TEMP $assetName
          $signature = "$installer.sig"
          Copy-Item $sourceInstaller.FullName $installer
          Copy-Item $sourceSignature $signature
          if (-not (Test-Path $signature)) { throw 'Updater signature asset was not prepared.' }
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $manifest = @{
            version = $config.version
            notes = "Flux Code $($config.version)"
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content $signature -Raw).Trim()
                url = "$base/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6
          $manifestPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          Set-Content -Path $manifestPath -Value $manifest -Encoding utf8
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "signature=$signature" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT
          Write-Host "Prepared signed release assets for $($config.version)."
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.signature }}
            ${{ steps.assets.outputs.manifest }}
