name: Flux Hands Windows release

on:
  push:
    tags:
      - 'v*'
      - 'publish-v*'
      - 'rebuild-v*'

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag and publish notes
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          release_tag="$GITHUB_REF_NAME"
          release_tag="${release_tag#publish-}"
          release_tag="${release_tag#rebuild-}"
          release_tag="${release_tag%-retry.*}"
          if [[ "$release_tag" != "v${version}" ]]; then
            echo "Tag $release_tag does not match version $version." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "notes_version=${version%%-beta.*}" >> "$GITHUB_OUTPUT"
      - id: draft
        name: Create or reuse GitHub draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: .github/release-notes/v${{ steps.version.outputs.notes_version }}.md
        run: |
          set -euo pipefail
          releases=$(gh api "repos/$REPOSITORY/releases?per_page=100")
          release=$(jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag and .draft == true)][0] // empty' <<<"$releases")
          if [[ -z "$release" ]]; then
            args=("$RELEASE_TAG" --draft --title "Flux Hands $RELEASE_TAG" --notes-file "$NOTES_FILE")
            if [[ "$RELEASE_TAG" == *-beta.* ]]; then args+=(--prerelease); fi
            if ! create_result=$(gh release create "${args[@]}" 2>&1); then
              echo "::error title=Draft release creation failed::${create_result//$'\n'/ }"
              exit 1
            fi
            echo "$create_result"
            releases=$(gh api "repos/$REPOSITORY/releases?per_page=100")
            release=$(jq -c --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag and .draft == true)][0] // empty' <<<"$releases")
          fi
          if [[ -z "$release" ]]; then
            echo "::error title=Draft release lookup failed::Could not find a draft release for $RELEASE_TAG after listing releases."
            exit 1
          fi
          if [[ $(jq -r '.tag_name' <<<"$release") != "$RELEASE_TAG" || $(jq -r '.draft' <<<"$release") != true ]]; then
            echo "::error title=Unexpected release state::Release $RELEASE_TAG exists but is not the expected draft."
            exit 1
          fi
          release_id=$(jq -r '.id' <<<"$release")
          echo "id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Using GitHub draft release $release_id for $RELEASE_TAG."
  release:
    needs: prepare_release
    runs-on: windows-latest
    outputs:
      assets: ${{ steps.upload_windows_assets.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Run strict Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test -- --test-threads=1 --nocapture
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets.'
          }
      - name: Build signed Windows NSIS installer
        run: npm run tauri -- build --bundles nsis --ci
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build Windows MSI with a WiX-compatible beta version
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($config.version -match '^(?<base>\d+\.\d+\.\d+)-beta\.(?<number>\d+)$') {
            $msiVersion = "$($Matches.base)-$($Matches.number)"
          } elseif ($config.version -match '^\d+\.\d+\.\d+$') {
            $msiVersion = [string]$config.version
          } else {
            throw "Cannot map app version '$($config.version)' to a WiX-compatible MSI version."
          }
          $override = @{ version = $msiVersion } | ConvertTo-Json -Compress
          $overridePath = Join-Path $env:RUNNER_TEMP 'tauri-msi-version.json'
          [System.IO.File]::WriteAllText($overridePath, $override, [System.Text.UTF8Encoding]::new($false))
          npm run tauri -- build --bundles msi --ci --no-sign --ignore-version-mismatches --config $overridePath
      - name: Prepare signed updater manifest
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ($env:RELEASE_TAG -ne "v$version") { throw "Tag $($env:RELEASE_TAG) does not match version $version." }
          $source = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $source) { throw 'NSIS installer was not generated.' }
          $sourceSig = "$($source.FullName).sig"
          if (-not (Test-Path $sourceSig)) { throw 'Tauri updater signature is missing.' }
          $msiVersion = if ($version -match '^(\d+\.\d+\.\d+)-beta\.(\d+)$') { "$($Matches[1])-$($Matches[2])" } else { $version }
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter "Flux Hands_${msiVersion}_x64_en-US.msi" | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer was not generated.' }
          $staging = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $assetName = "Flux.Hands_${version}_x64-setup.exe"
          $installer = Join-Path $staging $assetName
          $signature = "$installer.sig"
          Copy-Item $source.FullName $installer
          Copy-Item $sourceSig $signature
          $releaseMsiName = "Flux Hands_${version}_x64_en-US.msi"
          Copy-Item $msi.FullName (Join-Path $staging $releaseMsiName)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $manifest = @{
            version = $version
            notes = 'Flux Hands — локальная AI-среда разработки'
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content $signature -Raw).Trim()
                url = "$base/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6
          $manifestPath = Join-Path $staging 'latest.json'
          [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))
          $expected = @($assetName, "$assetName.sig", 'latest.json', $releaseMsiName)
          foreach ($name in $expected) {
            $assetPath = Join-Path $staging $name
            if (-not (Test-Path $assetPath) -or (Get-Item $assetPath).Length -le 0) { throw "Release asset is missing or empty: $name" }
          }
          "staging=release-assets" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes_version=$($version -replace '-beta\.\d+$','')" >> $env:GITHUB_OUTPUT
      - id: upload_windows_assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          name: Flux Hands ${{ needs.prepare_release.outputs.tag }}
          generate_release_notes: false
          prerelease: ${{ contains(needs.prepare_release.outputs.tag, '-beta.') }}
          draft: true
          overwrite_files: true
          body_path: .github/release-notes/v${{ steps.assets.outputs.notes_version }}.md
          files: release-assets/*
          fail_on_unmatched_files: true
  android:
    needs: prepare_release
    runs-on: ubuntu-24.04
    outputs:
      assets: ${{ steps.upload_android_asset.outputs.assets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Install Android platform tools
        run: sdkmanager --install --sdk_root="$ANDROID_HOME" 'platform-tools'
      - name: Install Android API 37.0 and build tools
        run: sdkmanager --install --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Install Android NDK
        run: |
          sdkmanager --install --sdk_root="$ANDROID_HOME" 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Generate application icons for all platforms
        run: npm run tauri -- icon src-tauri/icons/icon-manifest.json -o src-tauri/icons
      - name: Build installable Android ARM64 test APK
        run: npm run tauri -- android build --debug --apk --target aarch64 --config src-tauri/tauri.android.conf.json
      - name: Prepare APK release asset
        id: android_asset
        env:
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*arm64-v8a-debug*.apk' | head -n 1)
          if [ -z "$apk" ]; then apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1); fi
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/Flux.Hands_${RELEASE_TAG}_android-arm64-debug.apk"
          echo "apk=$RUNNER_TEMP/Flux.Hands_${RELEASE_TAG}_android-arm64-debug.apk" >> "$GITHUB_OUTPUT"
      - name: Upload Android APK to GitHub Release
        id: upload_android_asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare_release.outputs.tag }}
          files: ${{ steps.android_asset.outputs.apk }}
          fail_on_unmatched_files: true
          draft: true
          overwrite_files: true
  publish_release:
    needs: [prepare_release, release, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify both platform assets and publish release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare_release.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare_release.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = "https://api.github.com/repos/$env:REPOSITORY"
          if (-not $env:RELEASE_ID) { throw 'The draft release action did not return a release ID.' }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $expected = @(
            "Flux.Hands_${version}_x64-setup.exe",
            "Flux.Hands_${version}_x64-setup.exe.sig",
            'latest.json',
            "Flux.Hands_$($env:RELEASE_TAG)_android-arm64-debug.apk"
          )
          $msiName = "Flux Hands_${version}_x64_en-US.msi"
          $release = Invoke-RestMethod -Method Get -Uri "$base/releases/$env:RELEASE_ID" -Headers $headers
          if ($release.tag_name -ne $env:RELEASE_TAG -or -not $release.draft) { throw 'The expected GitHub draft release was not found.' }
          $assets = @($release.assets)
          $names = @($assets | ForEach-Object { $_.name })
          $requiredAssets = @($expected) + $msiName
          $assetProblems = @()
          foreach ($requiredName in $requiredAssets) {
            $matches = @($assets | Where-Object { $_.name -eq $requiredName })
            if ($matches.Count -ne 1) {
              $assetProblems += "$requiredName count=$($matches.Count)"
            } elseif ($matches[0].size -le 0) {
              $assetProblems += "$requiredName is empty"
            }
          }
          if ($assetProblems.Count -gt 0) {
            throw "Draft release assets did not pass verification. Issues: $($assetProblems -join '; '); returned names: $($names -join ', ')."
          }
          $verifiedAssets = @($assets | Where-Object { $_.name -in $requiredAssets })
          foreach ($asset in $verifiedAssets) {
            if ($asset.size -le 0) { throw "Release asset is empty: $($asset.name)" }
          }
          $body = @{ draft = $false; prerelease = ($env:RELEASE_TAG -match '-beta\.\d+$') } | ConvertTo-Json
          $published = Invoke-RestMethod -Method Patch -Uri "$base/releases/$env:RELEASE_ID" -Headers $headers -ContentType 'application/vnd.github+json' -Body $body
          if ($published.tag_name -ne $env:RELEASE_TAG -or $published.draft) { throw 'GitHub did not confirm publication of the verified release.' }
          $publishedAssets = @($published.assets)
          $publishedNames = @($publishedAssets | ForEach-Object { $_.name })
          $stillMissing = @($expected | Where-Object { $_ -notin $publishedNames })
          $publishedMsi = @($publishedAssets | Where-Object { $_.name -eq $msiName })
          if ($stillMissing.Count -gt 0 -or $publishedMsi.Count -ne 1) { throw "Published release response is missing assets: $($stillMissing -join ', '); matching MSI count: $($publishedMsi.Count)." }
          foreach ($asset in @($publishedAssets | Where-Object { $_.name -in $expected }) + $publishedMsi) {
            if ($asset.size -le 0) { throw "Published release contains an empty asset: $($asset.name)" }
          }
          Write-Host "Published $env:RELEASE_TAG after verifying $($verifiedAssets.Count) Windows and Android assets."
          $manifestAsset = $publishedAssets | Where-Object { $_.name -eq 'latest.json' } | Select-Object -First 1
          if (-not $manifestAsset) { throw 'The published release has no signed updater manifest.' }
          $manifestPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          Invoke-WebRequest -Uri $manifestAsset.browser_download_url -OutFile $manifestPath
          $legacyRelease = Invoke-RestMethod -Method Get -Uri "$base/releases/latest" -Headers $headers
          $legacyManifest = $legacyRelease.assets | Where-Object { $_.name -eq 'latest.json' } | Select-Object -First 1
          if ($legacyManifest) {
            Invoke-RestMethod -Method Delete -Uri "$base/releases/assets/$($legacyManifest.id)" -Headers $headers | Out-Null
          }
          $uploadBase = $legacyRelease.upload_url -replace '\{\?name,label\}$', ''
          $uploadHeaders = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $legacyUpload = Invoke-RestMethod -Method Post -Uri "$uploadBase`?name=latest.json" -Headers $uploadHeaders -ContentType 'application/octet-stream' -InFile $manifestPath
          if ($legacyUpload.name -ne 'latest.json' -or $legacyUpload.size -le 0) { throw 'GitHub did not confirm updating the legacy updater manifest.' }
          Write-Host "Updated legacy updater manifest on latest release $($legacyRelease.tag_name) for existing installs."
          $content = [Convert]::ToBase64String([System.IO.File]::ReadAllBytes($manifestPath))
          $contentsUri = "$base/contents/latest.json"
          $existing = $null
          try { $existing = Invoke-RestMethod -Method Get -Uri "$contentsUri`?ref=main" -Headers $headers }
          catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }
          $pointerBody = @{ message = "Update signed updater manifest for $($env:RELEASE_TAG)"; content = $content; branch = 'main' }
          if ($existing -and $existing.sha) { $pointerBody.sha = $existing.sha }
          $pointerCommit = Invoke-RestMethod -Method Put -Uri $contentsUri -Headers $headers -ContentType 'application/vnd.github+json' -Body ($pointerBody | ConvertTo-Json -Depth 5)
          if (-not $pointerCommit.commit.sha) { throw 'GitHub did not confirm publishing the updater manifest pointer.' }
          Write-Host "Updated raw GitHub updater manifest pointer in commit $($pointerCommit.commit.sha)."
      - name: Remove installers from older releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/cleanup-old-release-assets.ps1
