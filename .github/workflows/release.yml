name: Flux Hands Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets.'
          }
      - name: Build signed Windows installers
        run: npm run build:desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Prepare signed updater manifest
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ($env:RELEASE_TAG -ne ('v' + $version)) { throw "Tag $($env:RELEASE_TAG) does not match version $version." }
          $source = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $source) { throw 'NSIS installer was not generated.' }
          $sourceSig = "$($source.FullName).sig"
          if (-not (Test-Path $sourceSig)) { throw 'Tauri updater signature is missing.' }
          $assetName = "Flux.Hands_${version}_x64-setup.exe"
          $installer = Join-Path $env:RUNNER_TEMP $assetName
          $signature = "$installer.sig"
          Copy-Item $source.FullName $installer
          Copy-Item $sourceSig $signature
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $manifest = @{
            version = $version
            notes = 'Flux Hands — локальная AI-среда разработки'
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content $signature -Raw).Trim()
                url = "$base/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6
          $manifestPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))
          if (-not (Test-Path $installer) -or -not (Test-Path $signature) -or -not (Test-Path $manifestPath)) { throw 'Release assets were not prepared.' }
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "signature=$signature" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Flux Hands ${{ github.ref_name }}
          generate_release_notes: false
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.signature }}
            ${{ steps.assets.outputs.manifest }}
            src-tauri/target/release/bundle/msi/*.msi
      - name: Remove installers from older releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/cleanup-old-release-assets.ps1
