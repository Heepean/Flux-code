name: Flux Hands Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets.'
          }
      - name: Build signed Windows installers
        run: npm run build:desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Prepare signed updater manifest
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ($env:RELEASE_TAG -notmatch ('^v' + [regex]::Escape($version) + '(-beta\.\d+)?$')) { throw "Tag $($env:RELEASE_TAG) does not match version $version." }
          $source = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $source) { throw 'NSIS installer was not generated.' }
          $sourceSig = "$($source.FullName).sig"
          if (-not (Test-Path $sourceSig)) { throw 'Tauri updater signature is missing.' }
          $assetName = "Flux.Hands_${version}_x64-setup.exe"
          $installer = Join-Path $env:RUNNER_TEMP $assetName
          $signature = "$installer.sig"
          Copy-Item $source.FullName $installer
          Copy-Item $sourceSig $signature
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $manifest = @{
            version = $version
            notes = 'Flux Hands — локальная AI-среда разработки'
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content $signature -Raw).Trim()
                url = "$base/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6
          $manifestPath = Join-Path $env:RUNNER_TEMP 'latest.json'
          [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))
          if (-not (Test-Path $installer) -or -not (Test-Path $signature) -or -not (Test-Path $manifestPath)) { throw 'Release assets were not prepared.' }
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "signature=$signature" >> $env:GITHUB_OUTPUT
          "manifest=$manifestPath" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Flux Hands ${{ github.ref_name }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          body_path: .github/release-notes/v1.0.13.md
          files: |
            ${{ steps.assets.outputs.installer }}
            ${{ steps.assets.outputs.signature }}
            ${{ steps.assets.outputs.manifest }}
            src-tauri/target/release/bundle/msi/*.msi
      - name: Remove installers from older releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/cleanup-old-release-assets.ps1

  android:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-37' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build installable Android ARM64 test APK
        run: npm run tauri -- android build --debug --apk --target aarch64 --config src-tauri/tauri.android.conf.json
      - name: Prepare APK release asset
        id: android_asset
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*arm64-v8a-debug*.apk' | head -n 1)
          if [ -z "$apk" ]; then apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1); fi
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/Flux.Hands_${GITHUB_REF_NAME}_android-arm64-debug.apk"
          echo "apk=$RUNNER_TEMP/Flux.Hands_${GITHUB_REF_NAME}_android-arm64-debug.apk" >> "$GITHUB_OUTPUT"
      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.android_asset.outputs.apk }}
