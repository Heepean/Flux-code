name: Flux Hands Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag and publish notes
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_NAME" != "v${version}" && "$GITHUB_REF_NAME" != "v${version}-beta."* ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Flux Hands ${{ github.ref_name }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          draft: true
          body_path: .github/release-notes/v${{ steps.version.outputs.value }}.md
  release:
    needs: prepare_release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD in repository Actions secrets.'
          }
      - name: Build signed Windows installers
        run: npm run build:desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Prepare signed updater manifest
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          if ($env:RELEASE_TAG -notmatch ('^v' + [regex]::Escape($version) + '(-beta\.\d+)?$')) { throw "Tag $($env:RELEASE_TAG) does not match version $version." }
          $source = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $source) { throw 'NSIS installer was not generated.' }
          $sourceSig = "$($source.FullName).sig"
          if (-not (Test-Path $sourceSig)) { throw 'Tauri updater signature is missing.' }
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*.msi' | Select-Object -First 1
          if (-not $msi) { throw 'MSI installer was not generated.' }
          $staging = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $assetName = "Flux.Hands_${version}_x64-setup.exe"
          $installer = Join-Path $staging $assetName
          $signature = "$installer.sig"
          Copy-Item $source.FullName $installer
          Copy-Item $sourceSig $signature
          Copy-Item $msi.FullName (Join-Path $staging $msi.Name)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $manifest = @{
            version = $version
            notes = 'Flux Hands — локальная AI-среда разработки'
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content $signature -Raw).Trim()
                url = "$base/$assetName"
              }
            }
          } | ConvertTo-Json -Depth 6
          $manifestPath = Join-Path $staging 'latest.json'
          [System.IO.File]::WriteAllText($manifestPath, $manifest, [System.Text.UTF8Encoding]::new($false))
          $expected = @($assetName, "$assetName.sig", 'latest.json', $msi.Name)
          foreach ($name in $expected) {
            $assetPath = Join-Path $staging $name
            if (-not (Test-Path $assetPath) -or (Get-Item $assetPath).Length -le 0) { throw "Release asset is missing or empty: $name" }
          }
          "staging=release-assets" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Flux Hands ${{ github.ref_name }}
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          draft: true
          body_path: .github/release-notes/v${{ steps.assets.outputs.version }}.md
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Verify Windows release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = [string]$config.version
          $expected = @("Flux.Hands_${version}_x64-setup.exe", "Flux.Hands_${version}_x64-setup.exe.sig", 'latest.json', "Flux Hands_${version}_x64_en-US.msi")
          $release = Invoke-RestMethod -Method Get -Uri "$base/releases/tags/$env:RELEASE_TAG" -Headers $headers
          $assets = Invoke-RestMethod -Method Get -Uri $release.assets_url -Headers $headers
          $names = $assets | ForEach-Object { $_.name }
          $missing = $expected | Where-Object { $_ -notin $names }
          if ($missing) { throw "Release is missing assets: $($missing -join ', ')" }
          foreach ($name in $expected) {
            $asset = $assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($asset.size -le 0) { throw "Release asset is empty: $name" }
          }
          Write-Host "Verified $($expected.Count) non-empty Windows installer/updater assets for $env:RELEASE_TAG."
  android:
    needs: prepare_release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
      - name: Install Android platform tools
        run: sdkmanager --install --sdk_root="$ANDROID_HOME" 'platform-tools'
      - name: Install Android API 37.0 and build tools
        run: sdkmanager --install --sdk_root="$ANDROID_HOME" 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Install Android NDK
        run: |
          sdkmanager --install --sdk_root="$ANDROID_HOME" 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        run: npm ci
      - name: Initialize Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build installable Android ARM64 test APK
        run: npm run tauri -- android build --debug --apk --target aarch64 --config src-tauri/tauri.android.conf.json
      - name: Prepare APK release asset
        id: android_asset
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*arm64-v8a-debug*.apk' | head -n 1)
          if [ -z "$apk" ]; then apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1); fi
          test -n "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          cp "$apk" "$RUNNER_TEMP/Flux.Hands_${GITHUB_REF_NAME}_android-arm64-debug.apk"
          echo "apk=$RUNNER_TEMP/Flux.Hands_${GITHUB_REF_NAME}_android-arm64-debug.apk" >> "$GITHUB_OUTPUT"
      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.android_asset.outputs.apk }}
          fail_on_unmatched_files: true
          draft: true
      - name: Verify Android APK release asset
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $expected = "Flux.Hands_$($env:RELEASE_TAG)_android-arm64-debug.apk"
          $release = Invoke-RestMethod -Method Get -Uri "$base/releases/tags/$env:RELEASE_TAG" -Headers $headers
          $assets = Invoke-RestMethod -Method Get -Uri $release.assets_url -Headers $headers
          $apk = $assets | Where-Object { $_.name -eq $expected } | Select-Object -First 1
          if (-not $apk -or $apk.size -le 0) { throw "Android APK release asset is missing or empty: $expected" }
          Write-Host "Verified Android APK $expected ($($apk.size) bytes)."

  publish_release:
    needs: [release, android]
    runs-on: windows-latest
    steps:
      - name: Verify both platform assets and publish release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $base = "https://api.github.com/repos/$env:REPOSITORY"
          $version = $env:RELEASE_TAG -replace '^v', '' -replace '-beta\.\d+$', ''
          $expected = @(
            "Flux.Hands_${version}_x64-setup.exe",
            "Flux.Hands_${version}_x64-setup.exe.sig",
            'latest.json',
            "Flux Hands_${version}_x64_en-US.msi",
            "Flux.Hands_$($env:RELEASE_TAG)_android-arm64-debug.apk"
          )
          $release = Invoke-RestMethod -Method Get -Uri "$base/releases/tags/$env:RELEASE_TAG" -Headers $headers
          if (-not $release.draft) { throw 'Release was published before all platform assets were verified.' }
          $assets = Invoke-RestMethod -Method Get -Uri $release.assets_url -Headers $headers
          $missing = $expected | Where-Object { $_ -notin $assets.name }
          if ($missing) { throw "Draft release is missing assets: $($missing -join ', ')" }
          foreach ($name in $expected) {
            $asset = $assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if ($asset.size -le 0) { throw "Release asset is empty: $name" }
          }
          $body = @{ draft = $false; prerelease = ($env:RELEASE_TAG -match '-beta\.\d+$') } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri "$base/releases/$($release.id)" -Headers $headers -ContentType 'application/vnd.github+json' -Body $body | Out-Null
          Write-Host "Published $env:RELEASE_TAG after verifying all $($expected.Count) Windows and Android assets."
      - name: Remove installers from older releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/cleanup-old-release-assets.ps1
