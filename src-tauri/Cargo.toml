[package]
name = "flux-hands"
version = "1.0.18-beta.1"
description = "Local-first AI development studio"
authors = ["Flux Code"]
edition = "2021"

[workspace]

[lib]
name = "flux_hands_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "sync", "macros"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = { version = "4.2.0", default-features = false, features = ["v1"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"

[target.'cfg(windows)'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring = { version = "4.2.0", default-features = false, features = ["v1", "android-native-keyring-store"] }
