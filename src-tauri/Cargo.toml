[package]
name = "flux-hands"
version = "1.0.4"
description = "Local-first AI development studio"
authors = ["Flux Code"]
edition = "2021"

[lib]
name = "flux_hands_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "time", "sync"] }
futures-util = "0.3"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
keyring = { version = "4.2.0", default-features = false, features = ["v1", "windows-native-keyring-store"] }
